<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MDE Plant Operations Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #0f1923;
      color: #f0f4f8;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: #111d2b;
      border-bottom: 1px solid #1e3048;
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      background: #0f62fe;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.5px;
      color: #fff;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 15px;
      font-weight: 600;
      color: #f0f4f8;
      line-height: 1.2;
    }

    .header-subtitle {
      font-size: 11px;
      color: #7a9bbf;
      font-weight: 400;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0d2b1a;
      border: 1px solid #1a4a2e;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11px;
      color: #4ade80;
      font-weight: 500;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #4ade80;
      border-radius: 50%;
    }

    /* ── Plant selector bar ── */
    .plant-bar {
      background: #111d2b;
      border-bottom: 1px solid #1e3048;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 4px;
      height: 40px;
      flex-shrink: 0;
    }

    .plant-bar span {
      font-size: 11px;
      color: #7a9bbf;
      margin-right: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .plant-btn {
      background: none;
      border: 1px solid #1e3048;
      border-radius: 4px;
      color: #7a9bbf;
      font-size: 12px;
      padding: 3px 10px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .plant-btn.active {
      background: #0f62fe18;
      border-color: #0f62fe;
      color: #78a9ff;
    }

    /* ── Chat container ── */
    #root {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* Force the Orchestrate widget to fill the container */
    #root iframe,
    #root > div {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="logo-mark">MDE</div>
      <div>
        <div class="header-title">Plant Operations Assistant</div>
        <div class="header-subtitle">Markham District Energy · Powered by IBM watsonx</div>
      </div>
    </div>
    <div class="status-pill">
      <div class="status-dot"></div>
      Online
    </div>
  </header>

  <div class="plant-bar">
    <span>Plant:</span>
    <button class="plant-btn active">Warden (WEC)</button>
    <button class="plant-btn">Birchmount (BEC)</button>
    <button class="plant-btn">Clegg (CEC)</button>
  </div>

  <div id="root"></div>

  <script>
    window.wxOConfiguration = {
      orchestrationID: "8dc8eb31803841398cc2456be313a704_0ed5b56f-df5a-42e2-916f-dc852bd00638",
      hostURL: "https://ca-tor.watson-orchestrate.cloud.ibm.com",
      rootElementID: "root",
      deploymentPlatform: "ibmcloud",
      crn: "crn:v1:bluemix:public:watsonx-orchestrate:ca-tor:a/8dc8eb31803841398cc2456be313a704:0ed5b56f-df5a-42e2-916f-dc852bd00638::",
      chatOptions: {
        agentId: "cff054fc-1ef7-4163-a360-13901e6eeb10",
      }
    };

    setTimeout(function () {
      const script = document.createElement('script');
      script.src = `${window.wxOConfiguration.hostURL}/wxochat/wxoLoader.js?embed=true`;
      script.addEventListener('load', function () {
        wxoLoader.init();
      });
      document.head.appendChild(script);
    }, 0);
  </script>

</body>
</html>
